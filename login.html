<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Harta 将内容创作、主动获客与客户跟进连接起来。为小红书和抖音准备脚本、封面和直播，记录真实咨询与发布效果。">
  <title>Harta — 让好内容，带来下一位客户</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body>
  <a class="skip" href="#login">跳到登录</a>
  <main class="landing">
    <div class="landing-background" aria-hidden="true">
      <video id="hero-video" autoplay muted loop playsinline preload="none" tabindex="-1" data-src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260714_113715_c7e0daa0-8bdd-4486-a2da-040901f8f0ea.mp4"></video>
    </div>
    <header class="landing-header">
      <nav class="landing-nav" aria-label="首页导航">
        <a class="landing-brand" href="#intro" aria-label="Harta 首页"><svg width="24" height="24" viewBox="0 0 256 256" aria-hidden="true"><path d="M 256 256 L 128 256 L 0 128 L 128 128 Z"/><path d="M 256 128 L 128 128 L 0 0 L 128 0 Z"/></svg><span>Harta</span></a>
        <a class="landing-about" href="#intro">产品介绍</a>
        <a href="#login">登录</a>
        <a href="register.html">注册账号 <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <section class="landing-intro" id="intro" aria-labelledby="hero-title">
      <div class="landing-badge"><span aria-hidden="true">↗</span>内容创作与获客，一起向前</div>
      <p class="landing-display" lang="en">Make content <em>matter.</em></p>
      <h1 id="hero-title">让好内容，<br>带来下一位客户。</h1>
      <p class="landing-subtitle">从小红书、抖音的图文与视频，到脚本、封面与直播。<br class="desktop-break">让创作有方向，让真实咨询得到跟进，在复盘中找到下一步。</p>
      <a class="landing-cta" href="#login">进入工作台 <span aria-hidden="true">↗</span></a>
      <p class="landing-caption">内容获客 <span>·</span> 主动获客 <span>·</span> 客户跟进</p>
    </section>
    <section class="landing-login" id="login" aria-labelledby="login-title" hidden>
      <a class="landing-back" href="#intro">← 返回首页</a>
      <p class="login-wordmark" lang="en">Welcome back.</p>
      <h1 id="login-title">登录工作台</h1>
      <p class="login-note">继续你的创作与获客。</p>
      <form class="form" id="form">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
        <label for="password">密码</label>
        <div class="pass-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
          <button type="button" class="eye" data-eye="password" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
        </div>
        <p id="err" class="meta" role="alert" style="color:var(--down);min-height:1.4em;margin-top:16px"></p>
        <div class="acts"><button class="btn" type="submit">进入</button></div>
        <p class="meta" style="margin-top:14px">忘记密码？联系管理员获取重设激活码。</p>
      </form>

      <p class="login-register">已有激活码？<a href="register.html">注册账号</a></p>
    </section>
    <footer class="landing-footer"><span>HARTA / 灵鹿增长</span><button type="button" id="video-toggle" aria-pressed="false">播放背景</button><span class="landing-footer-note">让每一次创作，都更接近客户。</span></footer>
  </main>
  <script type="module" src="js/landing.js"></script>
  <script type="module">
    import { bindEyes } from "./js/eyes.js?v=20260819r";
    bindEyes();
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      const btn = e.target.querySelector("[type=submit]");
      if (btn.disabled) return;
      err.textContent = "";
      btn.disabled = true;
      btn.textContent = "正在进入…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          err.textContent = data.error || "登录失败";
          btn.disabled = false;
          btn.textContent = "进入";
          const email = document.getElementById("email");
          (email.value ? document.getElementById("password") : email).focus();
          return;
        }
        location.href = data.bootstrapped ? "/?first=1" : "/";
      } catch {
        err.textContent = "网络不通，请再试";
        btn.disabled = false;
        btn.textContent = "进入";
        document.getElementById("email").focus();
      }
    });
  </script>
</body>
</html>
