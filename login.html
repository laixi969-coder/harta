<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 猎鹰增长</title>
  <link rel="stylesheet" href="css/app.css?v=20260819k">
  <script>
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      var t = q || localStorage.getItem("falcon-theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <a class="skip" href="#form">跳到登录</a>
  <div class="gate">
    <aside class="gate-panel">
      <div>
        <img class="logo" src="images/logo-on-dark.png" width="1163" height="321" alt="猎鹰增长 Falcon">
        <p class="brand-line">助力线索｜引流｜获客</p>
      </div>
      <p class="gate-line">内部使用 · 各账各册</p>
    </aside>
    <main class="gate-form">
      <div class="hook">
        <h1>登录工作台</h1>
      </div>
      <div class="tabs">
        <a class="on" href="login.html">登录</a>
        <a href="register.html">注册</a>
      </div>
      <form class="form" id="form">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">密码</label>
        <div class="pass-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="eye" data-eye="password" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
        </div>
        <p id="err" class="meta" role="alert" style="color:var(--down);min-height:1.4em;margin-top:16px"></p>
        <div class="acts"><button class="btn" type="submit">进入</button></div>
      </form>
    </main>
  </div>
  <script type="module">
    import { bindEyes } from "./js/eyes.js?v=20260819k";
    bindEyes();
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      const btn = e.target.querySelector("[type=submit]");
      err.textContent = "";
      btn.disabled = true;
      btn.textContent = "正在进入…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          err.textContent = data.error || "登录失败";
          btn.disabled = false;
          btn.textContent = "进入";
          const email = document.getElementById("email");
          (email.value ? document.getElementById("password") : email).focus();
          return;
        }
        location.href = "/";
      } catch {
        err.textContent = "网络不通，请再试";
        btn.disabled = false;
        btn.textContent = "进入";
        document.getElementById("email").focus();
      }
    });
  </script>
</body>
</html>
