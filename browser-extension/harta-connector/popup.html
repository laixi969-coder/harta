<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Harta 连接器</title><style>
body{width:340px;margin:0;padding:20px;font:14px/1.6 system-ui;color:#23262c;background:#f4f5f7}h1{font-size:22px;margin:0}h2{font-size:16px}p{margin:8px 0}label{display:block;margin:12px 0}input:not([type=checkbox]){box-sizing:border-box;width:100%;padding:9px;border:1px solid #bfc5ce;border-radius:6px;font:inherit}button{padding:10px 14px;border:0;border-radius:6px;background:#a3390f;color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.6}small{display:block;color:#515967}.connection{border-top:1px solid #ccd1d9;padding:12px 0}.connection button{background:#e0e4e9;color:#23262c;margin-right:8px}.error{color:#a22d19;overflow-wrap:anywhere}#status{white-space:pre-wrap}a{color:#a3390f}
</style></head><body><h1>Harta 连接器</h1><p>先在浏览器登录抖音或小红书，再与工作台配对。</p><small>不上传平台密码或 Cookie。不同平台账号请使用不同浏览器用户配置，避免混用登录态。</small><details id="setup" open><summary>连接一个账号</summary><form id="pair"><label>Harta 地址<input id="origin" value="http://127.0.0.1:5173" required type="url"></label><label>工作台生成的一次性配对码<input id="code" required autocomplete="off"></label><label>这台浏览器的名称<input id="device" value="我的电脑" maxlength="100"></label><label><input id="attested" type="checkbox" required>我已核对当前浏览器登录的是工作台登记的账号</label><button type="submit">连接账号</button></form></details><label><input id="auto" type="checkbox">自动执行我在 Harta 发起的读取任务</label><small>每 30 秒检查一次，只读取明确创建的任务，读取任务与执行任务分别控制。</small><label><input id="delivery" type="checkbox">执行 Harta 中已确认的发布、消息和已启用自动回复规则</label><small>这会在平台实际提交。登录账号或接收人不能核对时会停止；结果不明时不自动重发。关闭此开关可停止领取新执行任务，已提交的操作无法撤回。</small><div id="connections"></div><button id="run">立即检查并执行读取任务</button><p id="status" role="status"></p><script type="module" src="popup.js"></script></body></html>
