<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Harta 将内容创作、主动获客与客户跟进连接起来。为小红书和抖音准备脚本、封面和直播，记录真实咨询与发布效果。">
  <title>注册账号 · Harta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body>
  <a class="skip" href="#form">跳到注册</a>
  <main class="landing landing-registration">
    <div class="landing-background" aria-hidden="true"></div>
    <header class="landing-header">
      <nav class="landing-nav" aria-label="首页导航">
        <a class="landing-brand" href="login.html" aria-label="Harta 首页"><img class="brand-logo" src="images/harta-logo.png" width="1276" height="386" alt="Harta 灵鹿线索"></a>
        <a class="landing-about" href="login.html">产品介绍</a>
        <a href="login.html#login">登录</a>
        <a href="register.html">注册账号 <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <section class="landing-login" aria-labelledby="registration-title">
      <a class="landing-back" href="login.html#login">← 返回登录</a>

      <h1 id="registration-title">注册账号</h1>

      <form class="form" id="form">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
        <label for="activation-code">激活码</label>
        <input id="activation-code" name="activationCode" autocomplete="one-time-code" maxlength="128" required placeholder="粘贴管理员发给你的激活码">
        <p class="meta">激活码 24 小时有效；未收到或已过期请联系管理员。</p>
        <label for="password">密码</label>
        <div class="pass-wrap">
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6" maxlength="128" placeholder="6–128 位">
          <button type="button" class="eye" data-eye="password" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
        </div>
        <label for="password2">再输入一次</label>
        <div class="pass-wrap">
          <input id="password2" name="password2" type="password" autocomplete="new-password" required minlength="6" maxlength="128">
          <button type="button" class="eye" data-eye="password2" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
        </div>
        <p id="err" class="meta" role="alert" style="color:var(--down);min-height:1.4em;margin-top:16px"></p>
        <div class="acts"><button class="btn" type="submit">完成注册</button></div>
      </form>
    </section>
  </main>
  <script type="module">
    import { bindEyes } from "./js/eyes.js?v=20260819r";
    bindEyes();
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      const btn = e.target.querySelector("[type=submit]");
      if (btn.disabled) return;
      err.textContent = "";
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;
      if (password !== password2) {
        err.textContent = "两次密码不一致";
        document.getElementById("password2").focus();
        return;
      }
      btn.disabled = true;
      btn.textContent = "正在注册…";
      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password,
            activationCode: document.getElementById("activation-code").value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          err.textContent = data.error || "注册失败";
          btn.disabled = false;
          btn.textContent = "完成注册";
          document.getElementById("email").focus();
          return;
        }
        location.href = "/";
      } catch {
        err.textContent = "网络不通，请再试";
        btn.disabled = false;
        btn.textContent = "完成注册";
        document.getElementById("email").focus();
      }
    });
  </script>
</body>
</html>
