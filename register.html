<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 · Falcon</title>
  <link rel="stylesheet" href="css/app.css">
  <style>.login-wrap{max-width:420px;margin:10vh auto;padding:0 20px}</style>
</head>
<body>
  <div class="login-wrap">
    <div class="hook">
      <div class="k">Falcon</div>
      <h1>注册</h1>
      <p class="meta">只有超级管理员加过白名单的邮箱才能注册。注册后只能看见自己的客户。</p>
    </div>
    <div class="tabs">
      <a href="login.html">登录</a>
      <a class="on" href="register.html">注册</a>
    </div>
    <form class="card form" id="form">
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="必须已在白名单">
      <label for="password">密码</label>
      <div class="pass-wrap">
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="至少 6 位">
        <button type="button" class="eye" data-eye="password" aria-label="显示密码">显示</button>
      </div>
      <label for="password2">再输入一次</label>
      <div class="pass-wrap">
        <input id="password2" name="password2" type="password" autocomplete="new-password">
        <button type="button" class="eye" data-eye="password2" aria-label="显示密码">显示</button>
      </div>
      <p id="err" class="meta" style="color:var(--down);min-height:1.4em;margin-top:10px"></p>
      <div class="acts"><button class="btn" type="submit">注册并进入</button></div>
    </form>
  </div>
  <script type="module">
    import { bindEyes } from "./js/eyes.js";
    bindEyes();
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;
      if (password !== password2) {
        err.textContent = "两次密码不一致";
        return;
      }
      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent = data.error || "注册失败";
        return;
      }
      location.href = "/";
    });
  </script>
</body>
</html>
