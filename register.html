<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 · 猎鹰增长</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      var t = q || localStorage.getItem("falcon-theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="gate">
    <aside class="gate-panel">
      <div>
        <img class="logo" src="images/logo-on-dark.png" width="1163" height="321" alt="猎鹰增长 Falcon">
        <p class="brand-line">助力线索｜引流｜获客</p>
      </div>
      <p class="gate-line">内部使用 · 各账各册</p>
    </aside>
    <main class="gate-form">
      <div class="hook">
        <h1>注册账号</h1>
        <p class="meta">只有超级管理员加过白名单的邮箱才能注册。注册后只能看见自己的客户。</p>
      </div>
      <div class="tabs">
        <a href="login.html">登录</a>
        <a class="on" href="register.html">注册</a>
      </div>
      <form class="form" id="form">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="必须已在白名单">
        <label for="password">密码</label>
        <div class="pass-wrap">
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="至少 6 位">
          <button type="button" class="eye" data-eye="password" aria-label="显示密码">显示</button>
        </div>
        <label for="password2">再输入一次</label>
        <div class="pass-wrap">
          <input id="password2" name="password2" type="password" autocomplete="new-password">
          <button type="button" class="eye" data-eye="password2" aria-label="显示密码">显示</button>
        </div>
        <p id="err" class="meta" style="color:var(--down);min-height:1.4em;margin-top:16px"></p>
        <div class="acts"><button class="btn" type="submit">完成注册</button></div>
      </form>
    </main>
  </div>
  <script type="module">
    import { bindEyes } from "./js/eyes.js";
    bindEyes();
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      const btn = e.target.querySelector("[type=submit]");
      err.textContent = "";
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;
      if (password !== password2) {
        err.textContent = "两次密码不一致";
        return;
      }
      btn.disabled = true;
      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          err.textContent = data.error || "注册失败";
          btn.disabled = false;
          return;
        }
        location.href = "/";
      } catch {
        err.textContent = "网络不通，请再试";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
